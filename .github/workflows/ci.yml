name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: lint-test-compile-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile check
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app run.py tests

      - name: Lint (Ruff) - non-blocking
        env:
          PYTHONPATH: .
        run: |
          ruff check app tests scripts run.py
        continue-on-error: true

      - name: Regression tests (pytest baseline) - non-blocking
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests
        continue-on-error: true

      - name: Smoke checks
        env:
          PYTHONPATH: .
        run: |
          python scripts/ci_smoke.py
