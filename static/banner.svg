<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d" />
      <stop offset="50%" stop-color="#111a14" />
      <stop offset="100%" stop-color="#05150f" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(52, 211, 153, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo escuro -->
  <rect width="1200" height="350" fill="url(#bg)" rx="12" ry="12"/>
  
  <!-- Grid tecnológico de fundo -->
  <rect width="1200" height="350" fill="url(#grid)" rx="12" ry="12"/>
  <rect width="1200" height="350" fill="url(#glow)" rx="12" ry="12"/>

  <!-- Bounding box estilo Visão Computacional -->
  <g transform="translate(100, 75)" opacity="0.8">
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="10 5" rx="8"/>
    <!-- Bordas marcadas da Bounding Box -->
    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M 170 0 L 200 0 L 200 30" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 170 L 0 200 L 30 200" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M 170 200 L 200 200 L 200 170" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ícone de muda (seedling) dentro da box -->
    <path d="M100 160 C100 110, 80 80, 50 60 C75 60, 95 80, 100 110 C105 80, 125 60, 150 60 C120 80, 100 110, 100 160 Z" fill="#6ee7b7" filter="url(#neonGlow)"/>
    <path d="M100 160 L100 190" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Label estilo YOLO -->
    <rect x="0" y="-30" width="105" height="25" fill="#34d399" rx="4"/>
    <text x="10" y="-13" fill="#000" font-family="monospace" font-size="14" font-weight="bold">seedling 0.98</text>
  </g>

  <!-- Textos -->
  <text x="360" y="160" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" letter-spacing="-1">GerminaVision</text>
  <text x="365" y="215" fill="#a3b8a8" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Inteligência Artificial para Monitoramento Agrícola</text>

  <!-- Pontos de conexão tecnológicos -->
  <circle cx="1100" cy="80" r="4" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="1050" cy="150" r="6" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="1130" cy="220" r="5" fill="#34d399" filter="url(#neonGlow)"/>
  <path d="M1100 80 L1050 150 L1130 220" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
</svg>
