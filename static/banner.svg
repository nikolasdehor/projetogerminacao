<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background gradient - rich deep green to dark teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a0e" />
      <stop offset="35%" stop-color="#062b1a" />
      <stop offset="65%" stop-color="#0a3528" />
      <stop offset="100%" stop-color="#041f15" />
    </linearGradient>

    <!-- Accent glow gradient -->
    <radialGradient id="glowCenter" cx="35%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Neon glow filter -->
    <filter id="neonSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neonStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neonSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="rgba(52, 211, 153, 0.15)" />
    </pattern>

    <!-- Scan lines -->
    <pattern id="scanLines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(52, 211, 153, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Leaf clip for decoration -->
    <clipPath id="roundedBanner">
      <rect width="1200" height="400" rx="16" ry="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <!-- Base background -->
    <rect width="1200" height="400" fill="url(#bgGrad)" />
    <rect width="1200" height="400" fill="url(#dots)" />
    <rect width="1200" height="400" fill="url(#scanLines)" />
    <rect width="1200" height="400" fill="url(#glowCenter)" />
    <rect width="1200" height="400" fill="url(#glowRight)" />

    <!-- Decorative organic lines (vine/branch patterns) -->
    <g opacity="0.12" stroke="#34d399" fill="none" stroke-width="1.5">
      <path d="M0 320 Q100 280 180 300 Q260 320 340 280 Q420 240 500 260" />
      <path d="M0 350 Q80 310 160 330 Q240 350 320 310 Q400 270 480 290" />
      <path d="M700 400 Q780 360 860 380 Q940 400 1020 360 Q1100 320 1200 340" />
    </g>

    <!-- Decorative scattered leaves -->
    <g opacity="0.07" fill="#6ee7b7">
      <ellipse cx="50" cy="60" rx="18" ry="8" transform="rotate(-30 50 60)" />
      <ellipse cx="1150" cy="350" rx="22" ry="9" transform="rotate(25 1150 350)" />
      <ellipse cx="1080" cy="50" rx="15" ry="6" transform="rotate(-45 1080 50)" />
      <ellipse cx="900" cy="370" rx="20" ry="8" transform="rotate(15 900 370)" />
    </g>

    <!-- === DETECTION FRAME (Left side) === -->
    <g transform="translate(80, 65)">
      <!-- Outer subtle glow -->
      <rect x="-8" y="-8" width="246" height="286" fill="none" stroke="#34d399" stroke-opacity="0.08" stroke-width="1" rx="16" />

      <!-- Detection box background -->
      <rect x="0" y="0" width="230" height="270" fill="rgba(16, 185, 129, 0.04)" rx="12" />
      <rect x="0" y="0" width="230" height="270" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" stroke-dasharray="6 4" rx="12" />

      <!-- Corner brackets - thick and prominent -->
      <path d="M 0 40 L 0 0 L 40 0" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#neonSubtle)" />
      <path d="M 190 0 L 230 0 L 230 40" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#neonSubtle)" />
      <path d="M 0 230 L 0 270 L 40 270" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#neonSubtle)" />
      <path d="M 190 270 L 230 270 L 230 230" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#neonSubtle)" />

      <!-- Crosshair in center -->
      <line x1="115" y1="115" x2="115" y2="155" stroke="#34d399" stroke-width="1" stroke-opacity="0.25" />
      <line x1="95" y1="135" x2="135" y2="135" stroke="#34d399" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="115" cy="135" r="3" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />

      <!-- Ilustracao de muda germinada -->
      <g transform="translate(115, 135)">
        <!-- Stem -->
        <path d="M0 20 C0 15 -2 5 0 -15 C2 5 0 15 0 20" fill="#4ade80" opacity="0.9" />
        <line x1="0" y1="20" x2="0" y2="70" stroke="#4ade80" stroke-width="4" stroke-linecap="round" filter="url(#neonSoft)" />

        <!-- Left leaf -->
        <path d="M0 -15 C-10 -30 -40 -50 -55 -65 C-40 -40 -15 -25 0 -15" fill="#6ee7b7" filter="url(#neonSoft)" />
        <path d="M0 -15 C-8 -28 -30 -45 -50 -58" fill="none" stroke="#a7f3d0" stroke-width="0.8" stroke-opacity="0.5" />

        <!-- Right leaf -->
        <path d="M0 -15 C10 -35 40 -55 55 -70 C40 -45 15 -25 0 -15" fill="#34d399" filter="url(#neonSoft)" />
        <path d="M0 -15 C8 -32 32 -50 50 -63" fill="none" stroke="#a7f3d0" stroke-width="0.8" stroke-opacity="0.5" />

        <!-- Small emerging leaf -->
        <path d="M0 0 C8 -8 18 -12 25 -15 C18 -8 8 -4 0 0" fill="#86efac" opacity="0.8" />

        <!-- Root hint -->
        <path d="M0 70 C-5 80 -10 88 -8 95" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" />
        <path d="M0 70 C5 82 8 90 6 98" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" />
        <path d="M0 70 C0 82 -2 90 0 95" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.2" stroke-linecap="round" />

        <!-- Soil line -->
        <line x1="-40" y1="70" x2="40" y2="70" stroke="#34d399" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3" />
      </g>

      <!-- YOLO-style label -->
      <g>
        <rect x="0" y="-38" width="150" height="30" fill="#10b981" rx="6" filter="url(#neonSubtle)" />
        <text x="12" y="-18" fill="#021a0e" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" font-weight="700" letter-spacing="0.5">Germinacao 0.98</text>
      </g>

      <!-- Secondary label -->
      <rect x="155" y="-38" width="75" height="30" fill="rgba(16, 185, 129, 0.15)" stroke="#34d399" stroke-width="1" rx="6" />
      <text x="166" y="-18" fill="#6ee7b7" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="500">leaves: 3</text>
    </g>

    <!-- === MAIN TEXT AREA (Right side) === -->
    <g transform="translate(380, 0)">
      <!-- Small decorative line -->
      <line x1="0" y1="120" x2="50" y2="120" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" />

      <!-- Main title -->
      <text y="175" fill="url(#titleGrad)" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
        GerminaVision
      </text>

      <!-- Subtitle -->
      <text y="218" fill="#86efac" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" font-weight="500" letter-spacing="4" text-transform="uppercase" opacity="0.8">
        COMPUTER VISION · AI · AGRICULTURE
      </text>

      <!-- Description -->
      <text y="265" fill="#94a3b8" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3">
        Monitoramento inteligente de germinação e crescimento de mudas
      </text>

      <!-- Tech tags -->
      <g transform="translate(0, 290)">
        <!-- YOLO tag -->
        <rect x="0" y="0" width="80" height="28" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1" rx="14" />
        <text x="18" y="19" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">YOLO11</text>

        <!-- Flask tag -->
        <rect x="90" y="0" width="68" height="28" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1" rx="14" />
        <text x="110" y="19" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">Flask</text>

        <!-- Python tag -->
        <rect x="168" y="0" width="80" height="28" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1" rx="14" />
        <text x="183" y="19" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">Python</text>

        <!-- LLM tag -->
        <rect x="258" y="0" width="60" height="28" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1" rx="14" />
        <text x="275" y="19" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">LLM</text>

        <!-- MCP tag -->
        <rect x="328" y="0" width="62" height="28" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1" rx="14" />
        <text x="345" y="19" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">MCP</text>
      </g>
    </g>

    <!-- === DECORATIVE ELEMENTS (Right side) === -->

    <!-- Neural network / connection nodes -->
    <g opacity="0.35">
      <circle cx="1050" cy="80" r="5" fill="#34d399" filter="url(#neonSoft)" />
      <circle cx="1120" cy="120" r="4" fill="#6ee7b7" filter="url(#neonSoft)" />
      <circle cx="1080" cy="180" r="6" fill="#34d399" filter="url(#neonSoft)" />
      <circle cx="1140" cy="230" r="3" fill="#6ee7b7" filter="url(#neonSoft)" />
      <circle cx="1060" cy="280" r="5" fill="#34d399" filter="url(#neonSoft)" />
      <circle cx="1130" cy="320" r="4" fill="#6ee7b7" filter="url(#neonSoft)" />

      <line x1="1050" y1="80" x2="1120" y2="120" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <line x1="1120" y1="120" x2="1080" y2="180" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <line x1="1080" y1="180" x2="1140" y2="230" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
      <line x1="1140" y1="230" x2="1060" y2="280" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
      <line x1="1060" y1="280" x2="1130" y2="320" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />

      <!-- Cross connections -->
      <line x1="1050" y1="80" x2="1080" y2="180" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="1120" y1="120" x2="1140" y2="230" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="1080" y1="180" x2="1060" y2="280" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.2" />
    </g>

    <!-- Data visualization dots (right side) -->
    <g opacity="0.15">
      <circle cx="950" cy="60" r="2" fill="#6ee7b7" />
      <circle cx="970" cy="45" r="1.5" fill="#34d399" />
      <circle cx="990" cy="55" r="2.5" fill="#6ee7b7" />
      <circle cx="960" cy="340" r="2" fill="#34d399" />
      <circle cx="980" cy="355" r="1.5" fill="#6ee7b7" />
      <circle cx="1000" cy="345" r="2" fill="#34d399" />
    </g>

    <!-- Bottom accent bar -->
    <rect x="0" y="392" width="1200" height="8" fill="#10b981" opacity="0.6" />
    <rect x="0" y="394" width="400" height="6" fill="#34d399" opacity="0.3" />
    <rect x="0" y="396" width="200" height="4" fill="#6ee7b7" opacity="0.2" />
  </g>
</svg>
